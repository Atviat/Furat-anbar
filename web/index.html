<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0710">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FURAT">
  <meta name="description" content="FURAT | فُرات — ANBAR'S SMART MAP">
  <title>FURAT | فُرات — ANBAR'S SMART MAP</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <main id="stage">
    <div id="map"></div>

    <header id="topbar">
      <div class="brandbar">
        <div class="brandmark"><b>FURAT | فُرات</b><small>ANBAR'S SMART MAP</small></div>
        <button id="lang" class="pill-btn" data-i18n="lang_btn" data-i18n-aria="lang_aria"></button>
      </div>
      <div id="chips" class="chips"></div>
      <div id="offline" class="offline" hidden><span data-icon="wifioff"></span><span data-i18n="offline"></span></div>
    </header>

    <button id="locate" class="fab" data-icon="locate" data-i18n-aria="my_location"></button>
    <div id="toast" role="status" aria-live="polite"></div>
  </main>

  <section id="card" hidden></section>

  <nav id="tabs">
    <button class="tab on" data-tab="map"><span class="ti" data-icon="map"></span><span data-i18n="nav_map"></span></button>
    <button class="tab" data-tab="search"><span class="ti" data-icon="search"></span><span data-i18n="nav_search"></span></button>
    <button class="tab" data-tab="favs"><span class="ti" data-icon="heart"></span><span data-i18n="nav_favorites"></span></button>
  </nav>

  <section id="panel-search" class="panel" hidden>
    <div class="screen-head">
      <div class="brandmark"><b>FURAT | فُرات</b><small>ANBAR'S SMART MAP</small></div>
      <h1 data-i18n="nav_search"></h1>
    </div>
    <div class="searchbox">
      <span class="si" data-icon="search"></span>
      <input id="q" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" data-i18n-ph="search_hint">
      <button id="q-clear" class="icon-btn" data-icon="close" data-i18n-aria="clear" hidden></button>
    </div>
    <div id="search-list"></div>
  </section>

  <section id="panel-favs" class="panel" hidden>
    <div class="screen-head">
      <div class="brandmark"><b>FURAT | فُرات</b><small>ANBAR'S SMART MAP</small></div>
      <h1 data-i18n="nav_favorites"></h1>
    </div>
    <div id="favs-list"></div>
  </section>

  <section id="details" class="panel full" hidden>
    <div class="bar">
      <button id="back" class="icon-btn rtl-flip" data-icon="back" data-i18n-aria="back"></button>
      <h2 id="d-title"></h2>
      <span id="d-fav"></span>
    </div>
    <div id="d-body" class="pad"></div>
  </section>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
